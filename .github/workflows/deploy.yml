name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["terraform/**", "*.md"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: nursing-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ env.PROJECT_NAME }}-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Sync database schema
        # Using `prisma db push` rather than `migrate deploy`: this project
        # has no prisma/migrations/ history yet (db push syncs schema.prisma
        # straight to the database, no migration files required). Switch to
        # `migrate deploy` once real migration files exist — see
        # terraform/README.md for that transition.
        env:
          CLUSTER: ${{ env.PROJECT_NAME }}-cluster
          FAMILY: ${{ env.PROJECT_NAME }}-app
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services --cluster "$CLUSTER" --services "${PROJECT_NAME}-service" \
            --query "services[0].networkConfiguration" --output json)
          SUBNETS=$(echo "$NETWORK_CONFIG" | jq -r '.awsvpcConfiguration.subnets | join(",")')
          SG=$(echo "$NETWORK_CONFIG" | jq -r '.awsvpcConfiguration.securityGroups | join(",")')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"${PROJECT_NAME}-app\",\"command\":[\"npx\",\"prisma\",\"db\",\"push\",\"--accept-data-loss\"]}]}" \
            --query "tasks[0].taskArn" --output text)

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Deploy new image to ECS
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ env.PROJECT_NAME }}-app
          IMAGE_TAG: ${{ github.sha }}
          CLUSTER: ${{ env.PROJECT_NAME }}-cluster
          SERVICE: ${{ env.PROJECT_NAME }}-service
          FAMILY: ${{ env.PROJECT_NAME }}-app
        run: |
          NEW_IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          CURRENT_TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query "taskDefinition")
          echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > new-task-def.json

          # Validate before attempting to register — if this fails, the
          # error points at the exact malformed spot instead of AWS's
          # generic "Invalid JSON received".
          jq empty new-task-def.json

          # A real temp file, not `file:///dev/stdin` — piping JSON into
          # that special path has a known history of failing silently or
          # with a generic parse error on some AWS CLI versions, since a
          # pipe doesn't behave identically to a real file for the
          # operations the CLI performs on it (e.g. determining size).
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json \
            --query "taskDefinition.taskDefinitionArn" --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_ARN"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
